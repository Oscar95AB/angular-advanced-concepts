<h1 class="text-3xl">Listado pokemons</h1>
<h2 class="text-xl">Página actual</h2>


<hr class="my-2">
@if( pokemons()) {
  <pokemon-list [pokemons]="pokemons()"/>
} @else {
  <pokemon-list-skeleton/>
}

<div class=" flex justify-between">
  <button (click)="loadPokemons(-1)" class="mt-2">Anteriores</button>
  <button (click)="loadPokemons(+1)" class="mt-2">Siguientes</button>
  <button (click)="currentName.set('OtroNombre')" class="mt-2">{{this.currentName()}}</button>
</div>
