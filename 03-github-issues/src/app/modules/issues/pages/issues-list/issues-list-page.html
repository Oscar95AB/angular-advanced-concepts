<h1>GitHub-issues</h1>
<div class="my-5 bprder-b-2 border-blue-600">

</div>
<section class="grid grid-cols-1 sm:grid-cols-3 gap-2">

  <!-- Botones para controlar estado-->
  <div class="flex flex-col col-span-3">
    <div class="flex gap-2">
      <button class="btn active">All</button>
      <button class="btn">Open</button>
      <button class="btn">Closed</button>
    </div>
  </div>

  <!-- Listado -->
   <div class="mt-4 flex flex-col col-span-2">
    @for(issue of issuesQuery.data(); track issue.id) {
      <issue-item [issue]="issue"></issue-item>

    } @empty {

      @if(issuesQuery.isLoading()){
        <p>Cargando issues</p>
      } @else {
        <p>No hay issues que mostrar</p>
      }

    }
</div>
   <!-- Labels -->
    <div>
      @if(query.isLoading()) {
        <p>Estamos cargando...</p>
      } @else {
       <labels-selector [labels]="query.data()?? []"></labels-selector>
      }
    </div>
</section>
