<div class="flex flex-wrap justify-content items-center gap-2">
  @for(label of labels(); track label.id) {
    <div
    class="border p2 rounded-md hover:bg-slate-950 cursor-pointer p-1"
    [ngStyle]="{'border-color': '#'+label.color}"
    (click)="onToggleLabel(label.name)"
    [class.selected-label]="isSelected(label.name)"
    >
{{label.name}}

    </div>
  }
</div>
