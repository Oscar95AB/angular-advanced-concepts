<div
  class="w-screen h-40 bg-gradient-to-b from-gray-800 to-gray-700 flex items-end text-right"
  style="max-width: 300px"
>
  <div class="w-full py-5 px-6 text-6xl text-white font-thin">
    @if(subResultText() !== '0'){
      <span class="text-4xl">{{subResultText()}} {{lastOperator()}}</span>
      <br />

    }
    <span test-id="result-text">{{resultText()}}</span>
  </div>
</div>
<div class="w-full bg-gradient-to-b from-indigo-400 to-indigo-500">
  <div class="flex w-full">
    <calculator-boton (onClick)="handleClick($event)"> C </calculator-boton>
    <calculator-boton (onClick)="handleClick($event)"> +/- </calculator-boton>
    <calculator-boton (onClick)="handleClick($event)"> % </calculator-boton>
    <calculator-boton (onClick)="handleClick($event)" isCommand> ÷ </calculator-boton>
  </div>
  <div class="flex w-full">
    <calculator-boton (onClick)="handleClick($event)"> 7 </calculator-boton>
    <calculator-boton (onClick)="handleClick($event)"> 8 </calculator-boton>
    <calculator-boton (onClick)="handleClick($event)"> 9 </calculator-boton>
    <calculator-boton (onClick)="handleClick($event)" isCommand> x </calculator-boton>
  </div>
  <div class="flex w-full">
    <calculator-boton (onClick)="handleClick($event)"> 4 </calculator-boton>
    <calculator-boton (onClick)="handleClick($event)"> 5 </calculator-boton>
    <calculator-boton (onClick)="handleClick($event)"> 6 </calculator-boton>
    <calculator-boton (onClick)="handleClick($event)" isCommand> - </calculator-boton>
  </div>
  <div class="flex w-full">
    <calculator-boton (onClick)="handleClick($event)"> 1 </calculator-boton>
    <calculator-boton (onClick)="handleClick($event)"> 2 </calculator-boton>
    <calculator-boton (onClick)="handleClick($event)"> 3 </calculator-boton>
    <calculator-boton (onClick)="handleClick($event)" isCommand> + </calculator-boton>
  </div>
  <div class="flex w-full">
    <calculator-boton (onClick)="handleClick($event)"> 0 </calculator-boton>
    <calculator-boton (onClick)="handleClick($event)"> . </calculator-boton>
    <calculator-boton (onClick)="handleClick($event)" isCommand isDoubleSize> = </calculator-boton>
  </div>
</div>
